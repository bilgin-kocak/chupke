# docker compose pull && docker compose up -d     # prebuilt image from CI (ghcr.io)
# docker compose up -d --build                     # or build here (first build compiles zingo-cli, ~5–15 min)
#
# Two processes, one image. The worker holds the wallets and the Bitrefill key and is not exposed.
# The web is public, holds no secrets, and shares only the SQLite volume (never the wallets volume).
# Put worker secrets in .env (see docs/DEPLOY.md). On first start the worker restores the shop wallet
# from ZINGO_SEED + WALLET_BIRTHDAY; remove ZINGO_SEED from .env afterwards.
#
# Public URL: add --profile tls (Caddy, automatic HTTPS for DOMAIN) or --profile tunnel (Cloudflare
# quick tunnel, prints a https://….trycloudflare.com URL in `docker compose logs tunnel`).
x-image: &image
  image: ${CHUPKE_IMAGE:-ghcr.io/bilgin-kocak/chupke:latest}
  build: .

services:
  worker:
    <<: *image
    command: ["node_modules/.bin/tsx", "src/worker.ts"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/db/chupke.db
      SHOP_WALLET_DIR: /app/wallets/shop
      INBOX_WALLET_DIR: /app/wallets/inbox
      ZINGO_CLI_PATH: /app/bin/zingo-cli
    volumes:
      - chupke-db:/app/db
      - chupke-wallets:/app/wallets
    restart: unless-stopped
    stop_grace_period: 2m   # let an in-flight tick (and wallet send) finish

  web:
    <<: *image
    command: ["node_modules/.bin/tsx", "src/web/server.ts"]
    # Only public settings: no env_file, so the web never sees worker secrets.
    environment:
      DATABASE_PATH: /app/db/chupke.db
      PORT: "8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SHOP_UA: ${SHOP_UA:-}
      DEMO_ZAT_PER_USD: ${DEMO_ZAT_PER_USD:-100000}
      MAX_ORDER_USD: ${MAX_ORDER_USD:-10}
      MAX_DAILY_USD: ${MAX_DAILY_USD:-30}
      MIN_CONFIRMATIONS: ${MIN_CONFIRMATIONS:-1}
      ORDER_TTL_MIN: ${ORDER_TTL_MIN:-20}
      EXPLORER_TX_URL: ${EXPLORER_TX_URL:-https://testnet.zcashexplorer.app/transactions/}
      DAILY_CAP_INCLUDES_TEST: ${DAILY_CAP_INCLUDES_TEST:-false}
    volumes:
      - chupke-db:/app/db
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "web:8080"]
    ports: ["80:80", "443:443"]
    volumes:
      - caddy-data:/data
    depends_on: [web]
    restart: unless-stopped

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8080"]
    depends_on: [web]
    restart: unless-stopped

volumes:
  chupke-db:
  chupke-wallets:
  caddy-data:
